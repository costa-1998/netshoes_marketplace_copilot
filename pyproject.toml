[project]
name = "kam-agent-core"
version = "0.1.0"
description = "Agente KAM Virtual para sellers Long Tail da Netshoes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.15",
    "langchain-google-vertexai>=2.0.0",
    "google-genai>=1.0.0",
    "google-cloud-bigquery>=3.25.0",
    "sqlglot>=25.30.0",
    "jinja2>=3.1.4",
    "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kam_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Catálogo de produtos do gerador: uma tupla longa por linha, sem ganho em quebrar.
"scripts/generate_synthetic_data.py" = ["E501"]
# B008: `Depends(...)` em default de parâmetro é o idioma do FastAPI.
"src/kam_agent/api/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"